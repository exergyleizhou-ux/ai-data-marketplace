# Production stack — one command to a running, self-hosted deployment.
#
#   cp .env.prod.example .env.prod   # then edit secrets + DOMAIN
#   docker compose --env-file .env.prod -f docker-compose.prod.yml build
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# What this gives you (real, not a mock):
#   - Caddy reverse proxy with automatic HTTPS on {DOMAIN}
#   - Go backend (migrations are an explicit deploy step), MinIO S3 storage,
#     Postgres + Redis, all on a private network — only Caddy is exposed (80/443).
#
# Honest substitutes for what needs real-world resources (see docs/部署-生产一键栈.md):
#   - PAYMENT_PROVIDER=mock by default (no real funds). Set =stripe with real keys
#     to move real money via Stripe; WeChat/Alipay split settlement still needs a
#     licensed Chinese provider + custody (a legal gate, not a code gate).
#   - KYC_AUTO_APPROVE=false → real-name submissions go to MANUAL ops review
#     (a legitimate operating model) instead of a third-party ID-verification API.
#   - L2 confidential compute stays gated on real TEE hardware; the runner falls
#     back to the L1 sandbox unless COMPUTE_RUNNER=tee + TEE_ATTESTER=tdx on a TEE node.

services:
  migrate:
    build:
      context: ./backend
      args: &oci-args
        OCI_REVISION: ${OASIS_IMAGE_TAG:?set OASIS_IMAGE_TAG to a git SHA}
        OCI_VERSION: ${OASIS_IMAGE_TAG}
        OCI_SOURCE: ${OCI_SOURCE:-https://github.com/exergyleizhou-ux/ai-data-marketplace}
    command: ["--migrate"]
    restart: "no"
    environment: &backend-env
      APP_ENV: production
      HTTP_ADDR: ":8080"
      APP_BASE_URL: "https://${DOMAIN}"
      CORS_ALLOW_ORIGIN: "https://${DOMAIN}"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      AUTO_MIGRATE: "false"
      JWT_SECRET: ${JWT_SECRET}
      WORKBENCH_JWT_SECRET: ${WORKBENCH_JWT_SECRET}
      WORKBENCH_RUNTIME_INGEST_SECRET: ${WORKBENCH_RUNTIME_INGEST_SECRET}
      PII_SECRET: ${PII_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      KYC_AUTO_APPROVE: "false"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_SSL: "false"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      PAYMENT_MOCK_SECRET: ${PAYMENT_MOCK_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY}
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback-only operator access for migrations/recovery; never public.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args: *oci-args
    restart: unless-stopped
    environment: *backend-env
    expose: ["8080"]
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        <<: *oci-args
        # Same-origin API: Caddy proxies /api/* to the backend, so the browser
        # bundle just calls a relative path. No hardcoded host.
        NEXT_PUBLIC_API_BASE_URL: "/api/v1"
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    expose: ["3000"]
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"]

  # Optional Lumen workbench (profile: lumen). All services are hosted-mode,
  # fail closed, private, and share the same durable state/control plane.
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml --profile lumen up -d
  # Point LUMEN_LAB_UPSTREAM at host-run lab if not using the profile:
  #   LUMEN_LAB_UPSTREAM=host.docker.internal:18992
  lumen-serve:
    profiles: ["lumen"]
    image: ${LUMEN_IMAGE:?set LUMEN_IMAGE to an immutable tag or digest}
    restart: unless-stopped
    command: ["serve", "--addr", "0.0.0.0:8787"]
    environment: &lumen-env
      LUMEN_HOSTED: "true"
      WORKBENCH_JWT_SECRET: ${WORKBENCH_JWT_SECRET}
      WORKBENCH_RUNTIME_INGEST_SECRET: ${WORKBENCH_RUNTIME_INGEST_SECRET}
      # Lumen deliberately accepts only the origin and appends the fixed,
      # machine-authenticated runtime/quota path itself.
      WORKBENCH_CONTROL_PLANE_URL: http://backend:8080
      WORKBENCH_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      WORKBENCH_OBJECT_DIR: /data/objects
      WORKBENCH_PARENT_ORIGIN: "https://${DOMAIN}"
      LUMEN_SCIENCE_DIR: /data/science
      LUMEN_PROVIDER: ${LUMEN_PROVIDER:?set hosted LUMEN_PROVIDER}
      LUMEN_MODEL: ${LUMEN_MODEL:?set hosted LUMEN_MODEL}
      LUMEN_API_KEY: ${LUMEN_API_KEY:?set hosted LUMEN_API_KEY via secret environment}
    working_dir: /run/secrets
    secrets: &lumen-secrets
      - source: lumen_config
        target: lumen.toml
    volumes:
      - lumendata:/data
    expose: ["8787"]
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_healthy }

  lumen-lab:
    profiles: ["lumen"]
    image: ${LUMEN_IMAGE:?set LUMEN_IMAGE to an immutable tag or digest}
    restart: unless-stopped
    command: ["science", "lab", "--no-browser", "--addr", "0.0.0.0:18992"]
    environment: *lumen-env
    working_dir: /run/secrets
    secrets: *lumen-secrets
    volumes:
      - lumendata:/data
    expose:
      - "18992"

  lumen-science:
    profiles: ["lumen"]
    image: ${LUMEN_IMAGE:?set LUMEN_IMAGE to an immutable tag or digest}
    restart: unless-stopped
    command: ["science", "gui", "--no-browser", "--addr", "0.0.0.0:18990"]
    environment: *lumen-env
    working_dir: /run/secrets
    secrets: *lumen-secrets
    volumes:
      - lumendata:/data
    expose:
      - "18990"

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      # Default: host-run Lumen on the Docker host (install binary on server).
      LUMEN_LAB_UPSTREAM: ${LUMEN_LAB_UPSTREAM:-host.docker.internal:18992}
      LUMEN_SCIENCE_UPSTREAM: ${LUMEN_SCIENCE_UPSTREAM:-host.docker.internal:18990}
      LUMEN_SERVE_UPSTREAM: ${LUMEN_SERVE_UPSTREAM:-host.docker.internal:8787}
    ports:
      - "${CADDY_BIND_IP:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_IP:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  lumendata:

secrets:
  lumen_config:
    file: ${LUMEN_CONFIG_FILE:?set LUMEN_CONFIG_FILE to a hosted lumen.toml}
